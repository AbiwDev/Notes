{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ note.title }}</title>

  <style>
    body {
      background: #3BCFFE;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
    }

    .detail-box {
      background: white;
      width: 360px;
      padding: 22px;
      border-radius: 20px;
      border: 3px solid #118682;
    }

    h2 {
      color: #118682;
      margin-bottom: 14px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .back {
      display: inline-block;
      background: #118682;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="detail-box">
  <h2>{{ note.title }}</h2>
  <p>{{ note.content }}</p>

  <a href="{% url 'notes:notes_list' %}" class="back">
    ← Artqa qaytıw
  </a>
</div>

</body>
</html>
